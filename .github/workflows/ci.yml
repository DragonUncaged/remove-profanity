name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18.x, 20.x, 22.x, 24.x]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  dictionary-sweep:
    name: Dictionary sweep (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: npm

      - name: Verify the dictionary is present (the sweep skips silently without it)
        run: |
          test -s /usr/share/dict/words
          lines=$(wc -l < /usr/share/dict/words)
          echo "/usr/share/dict/words: $lines lines"
          test "$lines" -ge 200000

      - run: npm ci

      - name: Test (with the dictionary sweep enabled)
        run: npm test
