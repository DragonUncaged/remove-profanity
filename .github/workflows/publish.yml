name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish to npm
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Upgrade npm (trusted publishing needs 11.5.1+)
        run: |
          npm install -g npm@latest
          npm --version

      - name: Verify the dictionary is present (the sweep skips silently without it)
        run: |
          test -s /usr/share/dict/words
          lines=$(wc -l < /usr/share/dict/words)
          echo "/usr/share/dict/words: $lines lines"
          test "$lines" -ge 200000

      - run: npm ci

      - name: Publish
        run: npm publish --provenance --access public
